CONFIG_ZTEST=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384

# newlib + networking make <net/nrf_cloud.h> (pulled in by the units under
# test) includable on native_sim, mirroring the nrf_cloud "cloud" test.
CONFIG_NEWLIB_LIBC=y
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=n

CONFIG_BASE64=y

# PSA crypto (software backend) + external RNG so the key generation, signing
# and public-key export run for real on the host.
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_PSA_CRYPTO_EXTERNAL_RNG=y
CONFIG_MBEDTLS_PSA_CRYPTO_EXTERNAL_RNG_ALLOW_NON_CSPRNG=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=8192
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

CONFIG_PSA_CRYPTO=y

# Persistent PSA key storage so PSA_KEY_LIFETIME_PERSISTENT keys survive within
# the run (recipe from tests/subsys/secure_storage/psa/crypto, native_sim).
CONFIG_SECURE_STORAGE=y
CONFIG_SECURE_STORAGE_PS_IMPLEMENTATION_ITS=y
CONFIG_SECURE_STORAGE_ITS_STORE_IMPLEMENTATION_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# TLS credentials, volatile backend (the default) for the opaque-key
# registration the units under test perform. Kept small so the rollback test
# can fill the store and force tls_credential_add() to fail.
CONFIG_TLS_CREDENTIALS=y
CONFIG_TLS_MAX_CREDENTIALS_NUMBER=4
CONFIG_TLS_CREDENTIALS_BACKEND_PROTECTED_STORAGE=y

# The key generation is implemented by the device key library. It selects the PSA and mbedTLS
# options it needs.
CONFIG_DEVICE_KEY=y

# mbedTLS X.509 CSR writing + opaque PK, needed by the CSR path. The remaining
# prerequisites (ASN1/OID) are pulled in by the PSA crypto configuration.
CONFIG_MBEDTLS_MD_C=y
# CSR parsing lets the test re-parse the generated CSR, and pulls in the x509
# core so mbedTLS builds cleanly with x509 writing enabled.
CONFIG_MBEDTLS_X509_CSR_PARSE_C=y
CONFIG_MBEDTLS_X509_USE_C=y

# Dummy shell backend so the test can drive the nrf_cloud_cred commands and
# capture their output. The output buffer is enlarged from its 400-byte default
# so the full Base64 CSR line is captured and the test can detect truncation.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_BACKEND_DUMMY=y
CONFIG_SHELL_BACKEND_DUMMY_BUF_SIZE=2048
