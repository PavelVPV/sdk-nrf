# Test APs for the nRF71 UMAC simulator. hwsim_setup.sh replaces @AP_IF@.
interface=@AP_IF@
bridge=br0
driver=nl80211
ssid=nrf71-sim
hw_mode=g
channel=6
ieee80211n=1
country_code=NO
auth_algs=1
wmm_enabled=1
ctrl_interface=/tmp/nrf71-sim-hostapd

# WPA2-PSK. The passphrase is a test value only.
bss=@AP_IF@_1
bridge=br0
ssid=nrf71-sim-wpa2
wmm_enabled=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=nrf71-sim-test

# WPA3-SAE with PMF required. The password is a test value only.
bss=@AP_IF@_2
bridge=br0
ssid=nrf71-sim-wpa3
wmm_enabled=1
wpa=2
wpa_key_mgmt=SAE
rsn_pairwise=CCMP
ieee80211w=2
sae_password=nrf71-sim-test
sae_pwe=2
