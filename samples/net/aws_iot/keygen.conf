# Generate the device private key and the certificate signing request (CSR) on the device with
# the `cred key` shell commands. The private key never leaves the device. Use together with
# wifi.conf. Do not provide a private-key.pem file in the certs/ folder.
# PEM parsing and a credential buffer that fits a certificate chain are needed to install the
# PEM certificates with nrfcredstore.
CONFIG_TLS_CREDENTIALS_KEYGEN=y
CONFIG_TLS_CREDENTIALS_SHELL=y
CONFIG_BASE64=y
CONFIG_MBEDTLS_PEM_PARSE_C=y
CONFIG_TLS_CREDENTIALS_SHELL_CRED_BUF_SIZE=4096
