description: |
    This is a representation of an external radio coexistence setup that has a
    one-pin control interface (GRANT).

include: base.yaml

properties:
  coex-pta-grant-gpios:
    type: phandle-array
    description: |
      A phandle to the GPIO controller that controls the GRANT signal.
      The GPIO controller must be defined in the device tree.
    required: true

compatible: "coex-pta-grant-gpios"
